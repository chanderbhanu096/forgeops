name: Mission E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start API dependencies
        env:
          DEFAULT_LLM_PROVIDER: demo
          DEFAULT_LLM_MODEL: forgeops-demo
        run: docker compose up -d --build postgres redis api

      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Launch informal mission and verify stream
        run: |
          set -euo pipefail
          response=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{
              "title":"Check why repo is broken",
              "description":"Check why the checkout API is broken and explain the safest fix.",
              "llm_provider":"demo",
              "llm_model":"forgeops-demo",
              "max_steps":50,
              "max_cost_usd":2
            }' \
            http://127.0.0.1:8000/api/v1/missions)
          mission_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$mission_id"
          test "$mission_id" != "null"

          timeout 15s curl --no-buffer --silent \
            "http://127.0.0.1:8000/api/v1/stream/$mission_id" \
            > /tmp/mission-events.txt &
          stream_pid=$!

          final=''
          for attempt in $(seq 1 60); do
            final=$(curl --fail --silent \
              "http://127.0.0.1:8000/api/v1/missions/$mission_id")
            status=$(printf '%s' "$final" | jq -r '.status')
            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$status" = "failed" ]; then
              printf '%s\n' "$final"
              exit 1
            fi
            sleep 1
          done

          test "$(printf '%s' "$final" | jq -r '.status')" = "completed"
          printf '%s' "$final" | jq -e '.checkpoint.environment_summary | length > 20'
          printf '%s' "$final" | jq -e '.checkpoint.hypotheses | length >= 1'
          printf '%s' "$final" | jq -e '.checkpoint.proposed_patch | length > 20'
          printf '%s' "$final" | jq -e '.checkpoint.scratchpad.retrieval_citations | length >= 1'

          wait "$stream_pid" || true
          grep -q 'state_starting' /tmp/mission-events.txt
          grep -q 'state_changed' /tmp/mission-events.txt
          grep -q 'completed' /tmp/mission-events.txt

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color api redis postgres
          test ! -f /tmp/mission-events.txt || cat /tmp/mission-events.txt

      - name: Stop services
        if: always()
        run: docker compose down -v
