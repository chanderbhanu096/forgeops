name: Real Repository Mission E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rewardlens:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEFAULT_LLM_PROVIDER: groq
      DEFAULT_LLM_MODEL: openai/gpt-oss-20b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FORGEOPS_GITHUB_APP_ID: ${{ secrets.FORGEOPS_GITHUB_APP_ID }}
      FORGEOPS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.FORGEOPS_GITHUB_APP_PRIVATE_KEY }}
      FORGEOPS_GITHUB_INSTALLATION_ID: ${{ secrets.FORGEOPS_GITHUB_INSTALLATION_ID }}
      MCP_SECRET: ${{ secrets.MCP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate integration credentials
        run: |
          set -euo pipefail
          test -n "${GROQ_API_KEY}"
          test -n "${FORGEOPS_GITHUB_APP_ID}"
          test -n "${FORGEOPS_GITHUB_APP_PRIVATE_KEY}"
          test -n "${FORGEOPS_GITHUB_INSTALLATION_ID}"
          test -n "${MCP_SECRET}"

      - name: Start API with real provider and GitHub App
        run: docker compose up -d --build postgres redis api

      - name: Wait for API
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color api postgres redis
          exit 1

      - name: Launch exact RewardLens mission and inspect generated output
        run: |
          set -euo pipefail
          response=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{
              "title":"RewardLens repository overview",
              "description":"https://github.com/chanderbhanu096/rewardlens-fraud-decision-lab.git INVESTIGATE THIS REPOS AND GIVE ME OVERVIEW",
              "llm_provider":"groq",
              "llm_model":"openai/gpt-oss-20b",
              "max_steps":20,
              "max_cost_usd":2
            }' \
            http://127.0.0.1:8000/api/v1/missions)
          mission_id=$(printf '%s' "$response" | jq -r '.id')
          test -n "$mission_id"
          test "$mission_id" != "null"

          timeout 180s curl --no-buffer --silent \
            "http://127.0.0.1:8000/api/v1/stream/$mission_id" \
            > /tmp/rewardlens-events.txt &
          stream_pid=$!

          final=''
          for attempt in $(seq 1 180); do
            final=$(curl --fail --silent \
              "http://127.0.0.1:8000/api/v1/missions/$mission_id")
            status=$(printf '%s' "$final" | jq -r '.status')
            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$status" = "failed" ]; then
              printf '%s\n' "$final" | jq .
              exit 1
            fi
            sleep 1
          done

          printf '%s' "$final" | jq . > /tmp/rewardlens-report.json
          jq -e '.status == "completed"' /tmp/rewardlens-report.json
          jq -e '.current_state == "completed"' /tmp/rewardlens-report.json
          jq -e '.error == null' /tmp/rewardlens-report.json
          jq -e '.checkpoint.repository_url == "https://github.com/chanderbhanu096/rewardlens-fraud-decision-lab"' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.mission_mode == "repository_overview"' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_identity.name == "rewardlens-fraud-decision-lab"' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_identity.default_branch | length > 0' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_identity.commit_sha | length == 40' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_identity.files_inspected >= 5' /tmp/rewardlens-report.json
          jq -e '.checkpoint.raw_evidence | length >= 5' /tmp/rewardlens-report.json
          jq -e '.checkpoint.relevant_files | length >= 5' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.retrieval_citations | length >= 5' /tmp/rewardlens-report.json
          jq -e '[.checkpoint.scratchpad.retrieval_citations[] | select(startswith("github://chanderbhanu096/rewardlens-fraud-decision-lab@"))] | length >= 5' /tmp/rewardlens-report.json

          jq -e '.checkpoint.scratchpad.repository_report.overview | length > 80' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_report.architecture | length >= 1' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_report.strengths | length >= 1' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_report.risks | length >= 1' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_report.recommendations | length >= 1' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.repository_report.confidence > 0' /tmp/rewardlens-report.json

          jq -e '.checkpoint.proposed_patch == null' /tmp/rewardlens-report.json
          jq -e '.checkpoint.changed_files == []' /tmp/rewardlens-report.json
          jq -e '.checkpoint.scratchpad.monitoring == null' /tmp/rewardlens-report.json
          ! grep -q 'Tool choice is none' /tmp/rewardlens-report.json
          ! grep -q '"path": ""' /tmp/rewardlens-report.json
          ! grep -q 'No evidence retrieved' /tmp/rewardlens-report.json

          wait "$stream_pid" || true
          grep -q 'state_starting' /tmp/rewardlens-events.txt
          grep -q 'state_changed' /tmp/rewardlens-events.txt
          grep -q 'completed' /tmp/rewardlens-events.txt

          jq -r '
            "# RewardLens Repository Review\n",
            "## Repository\n" + .checkpoint.repository_url,
            "## Commit\n" + .checkpoint.scratchpad.repository_identity.commit_sha,
            "## Overview\n" + .checkpoint.scratchpad.repository_report.overview,
            "## Architecture\n" + (.checkpoint.scratchpad.repository_report.architecture | map("- " + .) | join("\n")),
            "## Strengths\n" + (.checkpoint.scratchpad.repository_report.strengths | map("- " + .title + ": " + .detail) | join("\n")),
            "## Risks\n" + (.checkpoint.scratchpad.repository_report.risks | map("- [" + .severity + "] " + .title + ": " + .detail) | join("\n")),
            "## Recommendations\n" + (.checkpoint.scratchpad.repository_report.recommendations | map("- " + (.priority | tostring) + ". " + .title + ": " + .detail) | join("\n"))
          ' /tmp/rewardlens-report.json > /tmp/rewardlens-report.md
          cat /tmp/rewardlens-report.md

      - name: Upload exact mission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rewardlens-real-mission
          path: |
            /tmp/rewardlens-report.json
            /tmp/rewardlens-report.md
            /tmp/rewardlens-events.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color api postgres redis
          test ! -f /tmp/rewardlens-report.json || cat /tmp/rewardlens-report.json
          test ! -f /tmp/rewardlens-events.txt || cat /tmp/rewardlens-events.txt

      - name: Stop services
        if: always()
        run: docker compose down -v
