name: Diagnose GitHub App

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    name: List installations owned by configured app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: python -m pip install --disable-pip-version-check --quiet "PyJWT[crypto]==2.10.1" requests==2.32.5
      - name: List app installations safely
        env:
          APP_ID: ${{ secrets.FORGEOPS_GITHUB_APP_ID }}
          PRIVATE_KEY: ${{ secrets.FORGEOPS_GITHUB_APP_PRIVATE_KEY }}
          CONFIGURED_INSTALLATION_ID: ${{ secrets.FORGEOPS_GITHUB_INSTALLATION_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import jwt
          import requests

          if not os.getenv("APP_ID") or not os.getenv("PRIVATE_KEY"):
              print("::error::App ID or private key is missing")
              sys.exit(1)

          key = os.environ["PRIVATE_KEY"].replace("\\n", "\n").strip()
          now = int(time.time())
          token = jwt.encode(
              {"iat": now - 60, "exp": now + 540, "iss": os.environ["APP_ID"].strip()},
              key,
              algorithm="RS256",
          )
          response = requests.get(
              "https://api.github.com/app/installations?per_page=100",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=30,
          )
          if response.status_code != 200:
              print(
                  f"::error::App authentication failed with HTTP {response.status_code}: "
                  f"{response.json().get('message', 'unknown error')}"
              )
              sys.exit(1)

          installations = response.json()
          configured = os.getenv("CONFIGURED_INSTALLATION_ID", "").strip()
          print(f"Configured App ID: {os.environ['APP_ID'].strip()}")
          print(f"Installations found for this app: {len(installations)}")
          for installation in installations:
              account = installation.get("account", {}).get("login", "unknown")
              selection = installation.get("repository_selection", "unknown")
              installation_id = str(installation.get("id", ""))
              marker = " <- configured value" if installation_id == configured else ""
              print(
                  f"- account={account}, installation_id={installation_id}, "
                  f"repository_selection={selection}{marker}"
              )

          if not installations:
              print("::error::This GitHub App is not installed on any account")
              sys.exit(1)
          if configured not in {str(item.get('id')) for item in installations}:
              print(
                  "::error::FORGEOPS_GITHUB_INSTALLATION_ID does not match an installation "
                  "owned by the configured GitHub App"
              )
              sys.exit(1)

          print("Configured installation ID matches this GitHub App.")
          PY
