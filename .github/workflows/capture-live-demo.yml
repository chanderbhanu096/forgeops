name: Capture live product screenshots

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI / CD"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: live-product-screenshots
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'docs: refresh live screenshots'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Capture deployed mission flow
        env:
          FORGEOPS_URL: https://forgeops-staging-web.greenrock-70958585.northeurope.azurecontainerapps.io
        run: node scripts/capture-live-demo.mjs

      - name: Commit refreshed screenshots
        run: |
          git config user.name "forgeops-demo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/images/live/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged."
            exit 0
          fi
          git commit -m "docs: refresh live screenshots [skip ci]"
          git push origin main
