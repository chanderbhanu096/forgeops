# ForgeOps AI — GitHub Actions CI/CD pipeline
#
# Workflow:
#   1. On every push to main or PR: lint + typecheck + test
#   2. On push to main: build Docker images, push to registry, deploy
#
# Supports both AWS ECS and Azure Container Apps.
# Set DEPLOY_TARGET secret to "aws" or "azure" to select the target.
# Defaults to "aws" if not set.

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────

  test:
    name: Lint + typecheck + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: forgeops_test
          POSTGRES_USER: forgeops
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        working-directory: apps/api
        run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements-dev.txt 2>/dev/null || pip install poetry && poetry install

      - name: Ruff lint
        working-directory: apps/api
        run: python -m ruff check forgeops/ || true   # non-blocking in CI for now

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://forgeops:test_password@localhost:5432/forgeops_test
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test' }}
          ENVIRONMENT: development
        run: |
          python -m pytest tests/ -v --tb=short --cov=forgeops --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Build ───────────────────────────────────────────────────────────────────

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: mcp-github
            context: services/mcp-github
            dockerfile: services/mcp-github/Dockerfile
          - name: mcp-data
            context: services/mcp-data
            dockerfile: services/mcp-data/Dockerfile
          - name: mcp-knowledge
            context: services/mcp-knowledge
            dockerfile: services/mcp-knowledge/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS ECR
        if: vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Log in to ECR
        if: vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Authenticate to Azure ACR
        if: vars.DEPLOY_TARGET == 'azure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: vars.DEPLOY_TARGET == 'azure'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Determine registry
        id: registry
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "azure" ]; then
            echo "url=${{ vars.ACR_LOGIN_SERVER }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ steps.registry.outputs.url }}/forgeops-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.registry.outputs.url }}/forgeops-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to AWS ECS ────────────────────────────────────────────────────────

  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == '')
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Deploy Web service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Wait for API stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services \
              "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
              "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Smoke test
        run: |
          sleep 15
          curl -f "https://${{ vars.APP_DOMAIN }}/health" || exit 1
          echo "Smoke test passed."

  # ── Deploy to Azure Container Apps ──────────────────────────────────────────

  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_TARGET == 'azure'
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update API Container App
        run: |
          az containerapp update \
            --name "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/forgeops-api:${{ env.IMAGE_TAG }}"

      - name: Update Web Container App
        run: |
          az containerapp update \
            --name "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/forgeops-web:${{ env.IMAGE_TAG }}"

      - name: Smoke test
        run: |
          API_URL=$(az containerapp show \
            --name "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --query "properties.latestRevisionFqdn" -o tsv)
          sleep 20
          curl -f "https://${API_URL}/health" || exit 1
          echo "Smoke test passed."
