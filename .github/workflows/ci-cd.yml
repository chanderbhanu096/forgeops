# ForgeOps AI — GitHub Actions CI/CD pipeline

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Lint + typecheck + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            apps/api/.venv
          key: poetry-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            poetry-${{ env.PYTHON_VERSION }}-

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install poetry==1.8.3
          poetry config virtualenvs.in-project true

      - name: Install Python dependencies
        working-directory: apps/api
        run: poetry install --with dev --no-interaction

      - name: Ruff lint
        working-directory: apps/api
        run: poetry run ruff check forgeops/ --output-format=github

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+asyncpg://forgeops:test@localhost:5432/forgeops_test"
          REDIS_URL: "redis://localhost:6379"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-placeholder' }}
          ENVIRONMENT: development
          PYTHONPATH: "."
        run: |
          poetry run pytest tests/ -v --tb=short \
            --cov=forgeops --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend
        continue-on-error: true

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.REGISTRY_CONFIGURED == 'true'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: mcp-github
            context: services/mcp-github
            dockerfile: services/mcp-github/Dockerfile
          - name: mcp-data
            context: services/mcp-data
            dockerfile: services/mcp-data/Dockerfile
          - name: mcp-knowledge
            context: services/mcp-knowledge
            dockerfile: services/mcp-knowledge/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS ECR
        if: vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Log in to ECR
        if: vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Authenticate to Azure ACR
        if: vars.DEPLOY_TARGET == 'azure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: vars.DEPLOY_TARGET == 'azure'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Determine registry URL
        id: registry
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "azure" ]; then
            echo "url=${{ vars.ACR_LOGIN_SERVER }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://forgeops-staging-api.greenrock-70958585.northeurope.azurecontainerapps.io' }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL || 'wss://forgeops-staging-api.greenrock-70958585.northeurope.azurecontainerapps.io' }}
          tags: |
            ${{ steps.registry.outputs.url }}/forgeops-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.registry.outputs.url }}/forgeops-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == '')
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Deploy Web service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --force-new-deployment \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services \
              "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
              "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Smoke test
        run: |
          sleep 15
          curl -f "https://${{ vars.APP_DOMAIN }}/health" || exit 1
          echo "Smoke test passed."

  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_TARGET == 'azure'
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Register required Azure resource providers
        run: |
          az provider register -n Microsoft.App --wait
          az provider register -n Microsoft.OperationalInsights --wait

      - name: Configure optional LLM provider secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_OPENAI_API_KEY: ${{ secrets.CUSTOM_OPENAI_API_KEY }}
        run: |
          APP="forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api"
          RG="forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg"
          SECRET_ARGS=()

          [ -n "$OPENAI_API_KEY" ] && SECRET_ARGS+=("openai-api-key=$OPENAI_API_KEY")
          [ -n "$ANTHROPIC_API_KEY" ] && SECRET_ARGS+=("anthropic-api-key=$ANTHROPIC_API_KEY")
          [ -n "$GROQ_API_KEY" ] && SECRET_ARGS+=("groq-api-key=$GROQ_API_KEY")
          [ -n "$OPENROUTER_API_KEY" ] && SECRET_ARGS+=("openrouter-api-key=$OPENROUTER_API_KEY")
          [ -n "$CUSTOM_OPENAI_API_KEY" ] && SECRET_ARGS+=("custom-openai-api-key=$CUSTOM_OPENAI_API_KEY")

          if [ ${#SECRET_ARGS[@]} -gt 0 ]; then
            az containerapp secret set \
              --name "$APP" \
              --resource-group "$RG" \
              --secrets "${SECRET_ARGS[@]}"
          fi

      - name: Update API Container App
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CUSTOM_OPENAI_API_KEY: ${{ secrets.CUSTOM_OPENAI_API_KEY }}
        run: |
          ENV_ARGS=(
            "DEMO_MODE=${{ vars.DEMO_MODE || 'false' }}"
            "DEFAULT_LLM_PROVIDER=${{ vars.DEFAULT_LLM_PROVIDER || 'demo' }}"
            "DEFAULT_LLM_MODEL=${{ vars.DEFAULT_LLM_MODEL || 'forgeops-demo' }}"
            "GROQ_BASE_URL=${{ vars.GROQ_BASE_URL || 'https://api.groq.com/openai/v1' }}"
            "OPENROUTER_BASE_URL=${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}"
            "OLLAMA_BASE_URL=${{ vars.OLLAMA_BASE_URL }}"
            "CUSTOM_OPENAI_NAME=${{ vars.CUSTOM_OPENAI_NAME || 'Custom OpenAI-compatible' }}"
            "CUSTOM_OPENAI_BASE_URL=${{ vars.CUSTOM_OPENAI_BASE_URL }}"
          )

          [ -n "$OPENAI_API_KEY" ] && ENV_ARGS+=("OPENAI_API_KEY=secretref:openai-api-key")
          [ -n "$ANTHROPIC_API_KEY" ] && ENV_ARGS+=("ANTHROPIC_API_KEY=secretref:anthropic-api-key")
          [ -n "$GROQ_API_KEY" ] && ENV_ARGS+=("GROQ_API_KEY=secretref:groq-api-key")
          [ -n "$OPENROUTER_API_KEY" ] && ENV_ARGS+=("OPENROUTER_API_KEY=secretref:openrouter-api-key")
          [ -n "$CUSTOM_OPENAI_API_KEY" ] && ENV_ARGS+=("CUSTOM_OPENAI_API_KEY=secretref:custom-openai-api-key")

          az containerapp update \
            --name "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/forgeops-api:${{ env.IMAGE_TAG }}" \
            --set-env-vars "${ENV_ARGS[@]}"

      - name: Update Web Container App
        run: |
          az containerapp update \
            --name "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/forgeops-web:${{ env.IMAGE_TAG }}"

      - name: Smoke test
        run: |
          API_URL=$(az containerapp show \
            --name "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --query "properties.latestRevisionFqdn" -o tsv)
          sleep 20
          curl -f "https://${API_URL}/health" || exit 1
          echo "Smoke test passed."
