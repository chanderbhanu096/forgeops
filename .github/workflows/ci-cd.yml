# ForgeOps AI — GitHub Actions CI/CD pipeline
#
# Workflow:
#   1. On every push to main or PR: lint + typecheck + test
#   2. On push to main: build Docker images, push to registry, deploy
#
# Supports both AWS ECS and Azure Container Apps.
# Set DEPLOY_TARGET variable to "aws" or "azure" to select the target.
# Defaults to "aws" if not set.

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Test ──────────────────────────────────────────────────────────────────────

  test:
    name: Lint + typecheck + tests
    runs-on: ubuntu-latest

    # Tests use SQLite in-memory — no postgres/redis service containers needed.
    # The DATABASE_URL and REDIS_URL below are set to satisfy Settings validation
    # but the test conftest overrides the engine with SQLite before any I/O runs.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            apps/api/.venv
          key: poetry-${{ env.PYTHON_VERSION }}-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            poetry-${{ env.PYTHON_VERSION }}-

      - name: Install Poetry
        run: |
          pip install --upgrade pip
          pip install poetry==1.8.3
          poetry config virtualenvs.in-project true

      - name: Install Python dependencies
        working-directory: apps/api
        run: poetry install --with dev --no-interaction

      - name: Ruff lint
        working-directory: apps/api
        run: poetry run ruff check forgeops/ --output-format=github

      - name: Run tests
        working-directory: apps/api
        env:
          # Dummy values — conftest replaces the DB engine with SQLite in-memory
          DATABASE_URL: "postgresql+asyncpg://forgeops:test@localhost:5432/forgeops_test"
          REDIS_URL: "redis://localhost:6379"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-placeholder' }}
          ENVIRONMENT: development
          PYTHONPATH: "."
        run: |
          poetry run pytest tests/ -v --tb=short \
            --cov=forgeops --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend
        continue-on-error: true

  # ── Build ─────────────────────────────────────────────────────────────────────
  # Only runs when registry credentials are configured.
  #
  # How to enable:
  #   1. Go to repo Settings → Variables → Actions
  #   2. Add a repository variable:  REGISTRY_CONFIGURED = true
  #   3. Add the matching secrets (AWS_ACCESS_KEY_ID / AZURE_CREDENTIALS, etc.)
  #
  # GitHub Actions does NOT allow secrets to be compared in job-level `if:`
  # conditions — only repository variables (vars.*) work there.
  # Without REGISTRY_CONFIGURED the build job is cleanly skipped.

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.REGISTRY_CONFIGURED == 'true'

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: mcp-github
            context: services/mcp-github
            dockerfile: services/mcp-github/Dockerfile
          - name: mcp-data
            context: services/mcp-data
            dockerfile: services/mcp-data/Dockerfile
          - name: mcp-knowledge
            context: services/mcp-knowledge
            dockerfile: services/mcp-knowledge/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS ECR
        if: vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Log in to ECR
        if: vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Authenticate to Azure ACR
        if: vars.DEPLOY_TARGET == 'azure'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: vars.DEPLOY_TARGET == 'azure'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Determine registry URL
        id: registry
        run: |
          if [ "${{ vars.DEPLOY_TARGET }}" = "azure" ]; then
            echo "url=${{ vars.ACR_LOGIN_SERVER }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context:    ${{ matrix.service.context }}
          file:       ${{ matrix.service.dockerfile }}
          push:       true
          tags: |
            ${{ steps.registry.outputs.url }}/forgeops-${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
            ${{ steps.registry.outputs.url }}/forgeops-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Deploy to AWS ECS ─────────────────────────────────────────────────────────

  deploy-aws:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      (vars.DEPLOY_TARGET == 'aws' || vars.DEPLOY_TARGET == '')
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service  "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --force-new-deployment \
            --region   "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Deploy Web service
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service  "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --force-new-deployment \
            --region   "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster  "${{ vars.ECS_CLUSTER }}" \
            --services \
              "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
              "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --region "${{ vars.AWS_REGION || 'eu-west-1' }}"

      - name: Smoke test
        run: |
          sleep 15
          curl -f "https://${{ vars.APP_DOMAIN }}/health" || exit 1
          echo "Smoke test passed."

  # ── Deploy to Azure Container Apps ───────────────────────────────────────────

  deploy-azure:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_TARGET == 'azure'
    environment: ${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update API Container App
        run: |
          az containerapp update \
            --name             "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --resource-group   "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --image            "${{ vars.ACR_LOGIN_SERVER }}/forgeops-api:${{ env.IMAGE_TAG }}"

      - name: Update Web Container App
        run: |
          az containerapp update \
            --name             "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-web" \
            --resource-group   "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --image            "${{ vars.ACR_LOGIN_SERVER }}/forgeops-web:${{ env.IMAGE_TAG }}"

      - name: Smoke test
        run: |
          API_URL=$(az containerapp show \
            --name           "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-api" \
            --resource-group "forgeops-${{ vars.DEPLOY_ENVIRONMENT || 'staging' }}-rg" \
            --query "properties.latestRevisionFqdn" -o tsv)
          sleep 20
          curl -f "https://${API_URL}/health" || exit 1
          echo "Smoke test passed."
