services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeops-postgres
    environment:
      POSTGRES_DB: forgeops
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeops_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forgeops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: forgeops-api
    environment:
      DATABASE_URL: postgresql+asyncpg://forgeops:${POSTGRES_PASSWORD:-forgeops_dev}@postgres:5432/forgeops
      REDIS_URL: redis://redis:6379
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-demo}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-forgeops-demo}
      DEMO_MODE: ${DEMO_MODE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODELS: ${OPENAI_MODELS:-gpt-5-mini,gpt-4.1-mini,gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODELS: ${ANTHROPIC_MODELS:-claude-sonnet-4-20250514,claude-opus-4-20250514}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODELS: ${GROQ_MODELS:-openai/gpt-oss-20b,openai/gpt-oss-120b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-openrouter/auto}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODELS: ${OLLAMA_MODELS:-llama3.2,qwen2.5-coder}
      CUSTOM_OPENAI_NAME: ${CUSTOM_OPENAI_NAME:-Custom OpenAI-compatible}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-}
      CUSTOM_OPENAI_MODELS: ${CUSTOM_OPENAI_MODELS:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /var/run/docker.sock:/var/run/docker.sock
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app

  mcp-github:
    build:
      context: ./services/mcp-github
      dockerfile: Dockerfile
    container_name: forgeops-mcp-github
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MCP_SECRET: ${MCP_SECRET:-forgeops_mcp_dev}
    ports:
      - "8001:8001"

  mcp-data:
    build:
      context: ./services/mcp-data
      dockerfile: Dockerfile
    container_name: forgeops-mcp-data
    environment:
      DATABASE_URL: postgresql+asyncpg://forgeops:${POSTGRES_PASSWORD:-forgeops_dev}@postgres:5432/forgeops
      MCP_SECRET: ${MCP_SECRET:-forgeops_mcp_dev}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-knowledge:
    build:
      context: ./services/mcp-knowledge
      dockerfile: Dockerfile
    container_name: forgeops-mcp-knowledge
    environment:
      DATABASE_URL: postgresql+asyncpg://forgeops:${POSTGRES_PASSWORD:-forgeops_dev}@postgres:5432/forgeops
      MCP_SECRET: ${MCP_SECRET:-forgeops_mcp_dev}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: forgeops-web
    environment:
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app

volumes:
  postgres_data:
  redis_data:
