version: "3.9"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: forgeops-postgres
    environment:
      POSTGRES_DB: forgeops
      POSTGRES_USER: forgeops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgeops_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forgeops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Core API ───────────────────────────────────────────────────────────────

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: forgeops-api
    environment:
      DATABASE_URL: postgresql+asyncpg://forgeops:${POSTGRES_PASSWORD:-forgeops_dev}@postgres:5432/forgeops
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /var/run/docker.sock:/var/run/docker.sock   # sandbox executor
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /app

  # ── Sandbox executor ───────────────────────────────────────────────────────

  sandbox:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    container_name: forgeops-sandbox
    environment:
      MAX_EXECUTION_SECONDS: "30"
      MAX_MEMORY_MB: "256"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    privileged: true   # required for docker-in-docker

  # ── MCP Servers ────────────────────────────────────────────────────────────

  mcp-github:
    build:
      context: ./services/mcp-github
      dockerfile: Dockerfile
    container_name: forgeops-mcp-github
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MCP_SECRET: ${MCP_SECRET:-forgeops_mcp_dev}
    ports:
      - "8001:8001"
    depends_on:
      - api

  mcp-data:
    build:
      context: ./services/mcp-data
      dockerfile: Dockerfile
    container_name: forgeops-mcp-data
    environment:
      DATABASE_URL: postgresql+asyncpg://forgeops:${POSTGRES_PASSWORD:-forgeops_dev}@postgres:5432/forgeops
      MCP_SECRET: ${MCP_SECRET:-forgeops_mcp_dev}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-knowledge:
    build:
      context: ./services/mcp-knowledge
      dockerfile: Dockerfile
    container_name: forgeops-mcp-knowledge
    environment:
      DATABASE_URL: postgresql+asyncpg://forgeops:${POSTGRES_PASSWORD:-forgeops_dev}@postgres:5432/forgeops
      MCP_SECRET: ${MCP_SECRET:-forgeops_mcp_dev}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: forgeops-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app

volumes:
  postgres_data:
  redis_data:
