<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ForgeOps Mission Control preview</title>
  <desc id="desc">A dark interface showing a new mission form, provider selection, and recent missions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0b1220" stroke="#263247"/>
  <rect x="28" y="24" width="1144" height="68" rx="18" fill="#101827"/>
  <circle cx="62" cy="58" r="8" fill="#22d3ee"/>
  <text x="82" y="65" fill="#f8fafc" font-size="24" font-family="Arial, sans-serif" font-weight="700">ForgeOps Mission Control</text>
  <rect x="1002" y="44" width="134" height="30" rx="15" fill="#0f2d25" stroke="#16a34a"/>
  <circle cx="1022" cy="59" r="5" fill="#22c55e"/>
  <text x="1035" y="64" fill="#bbf7d0" font-size="13" font-family="Arial, sans-serif">SYSTEM LIVE</text>

  <text x="62" y="134" fill="#f8fafc" font-size="30" font-family="Arial, sans-serif" font-weight="700">Start a new mission</text>
  <text x="62" y="160" fill="#94a3b8" font-size="15" font-family="Arial, sans-serif">Describe the outcome. ForgeOps plans, investigates, verifies and pauses before execution.</text>

  <rect x="62" y="190" width="515" height="404" rx="16" fill="#111a2a" stroke="#263247"/>
  <text x="88" y="226" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif" font-weight="700">MISSION TITLE</text>
  <rect x="88" y="240" width="463" height="48" rx="9" fill="#0a1220" stroke="#334155"/>
  <text x="104" y="270" fill="#e2e8f0" font-size="15" font-family="Arial, sans-serif">Investigate API deployment failure</text>

  <text x="88" y="322" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif" font-weight="700">MISSION BRIEF</text>
  <rect x="88" y="336" width="463" height="116" rx="9" fill="#0a1220" stroke="#334155"/>
  <text x="104" y="366" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">Inspect the deployment, identify the root cause,</text>
  <text x="104" y="390" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">verify a safe fix and provide an approval-ready plan.</text>
  <text x="104" y="423" fill="#64748b" font-size="13" font-family="Arial, sans-serif">No destructive changes without approval.</text>

  <text x="88" y="486" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif" font-weight="700">AI PROVIDER</text>
  <rect x="88" y="500" width="222" height="44" rx="9" fill="#0a1220" stroke="#334155"/>
  <text x="104" y="527" fill="#f8fafc" font-size="14" font-family="Arial, sans-serif">Groq</text>
  <path d="M286 518 l7 7 7-7" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="326" y="500" width="225" height="44" rx="9" fill="#0a1220" stroke="#334155"/>
  <text x="342" y="527" fill="#f8fafc" font-size="13" font-family="Arial, sans-serif">openai/gpt-oss-20b</text>
  <rect x="88" y="558" width="463" height="48" rx="10" fill="url(#accent)"/>
  <text x="250" y="589" fill="#06111d" font-size="15" font-family="Arial, sans-serif" font-weight="700">START MISSION</text>

  <rect x="607" y="190" width="529" height="404" rx="16" fill="#111a2a" stroke="#263247"/>
  <text x="633" y="226" fill="#f8fafc" font-size="18" font-family="Arial, sans-serif" font-weight="700">Recent missions</text>
  <text x="1014" y="226" fill="#64748b" font-size="13" font-family="Arial, sans-serif">LIVE UPDATES</text>

  <rect x="633" y="250" width="477" height="82" rx="11" fill="#0a1220" stroke="#334155"/>
  <circle cx="657" cy="274" r="6" fill="#f59e0b"/>
  <text x="674" y="279" fill="#f8fafc" font-size="15" font-family="Arial, sans-serif" font-weight="700">Analyze deployment failure</text>
  <text x="674" y="305" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">Awaiting approval · 9 steps · Groq</text>
  <rect x="985" y="270" width="96" height="28" rx="14" fill="#392b13"/>
  <text x="1001" y="289" fill="#fde68a" font-size="12" font-family="Arial, sans-serif">APPROVAL</text>

  <rect x="633" y="346" width="477" height="82" rx="11" fill="#0a1220" stroke="#334155"/>
  <circle cx="657" cy="370" r="6" fill="#22c55e"/>
  <text x="674" y="375" fill="#f8fafc" font-size="15" font-family="Arial, sans-serif" font-weight="700">Validate revenue pipeline</text>
  <text x="674" y="401" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">Completed · 12 steps · Demo simulator</text>
  <rect x="985" y="366" width="96" height="28" rx="14" fill="#123322"/>
  <text x="1000" y="385" fill="#bbf7d0" font-size="12" font-family="Arial, sans-serif">COMPLETE</text>

  <rect x="633" y="442" width="477" height="126" rx="11" fill="#0d1727" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="657" y="475" fill="#67e8f9" font-size="13" font-family="Arial, sans-serif" font-weight="700">WHY THIS IS DIFFERENT</text>
  <text x="657" y="505" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">Each mission is a durable state machine with budgets,</text>
  <text x="657" y="529" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif">evidence, deterministic verification and human control.</text>
  <text x="657" y="551" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">Not just a chat response — an auditable engineering workflow.</text>

  <text x="600" y="632" text-anchor="middle" fill="#64748b" font-size="12" font-family="Arial, sans-serif">Illustrated preview based on the current ForgeOps interface</text>
</svg>
