<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ForgeOps execution graph preview</title>
  <desc id="desc">A mission detail interface showing the state machine, current activity, budgets, provider and generated evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0b1220" stroke="#263247"/>
  <rect x="28" y="24" width="1144" height="82" rx="18" fill="#101827"/>
  <text x="62" y="61" fill="#f8fafc" font-size="24" font-family="Arial, sans-serif" font-weight="700">Analyze deployment failure</text>
  <rect x="62" y="72" width="124" height="24" rx="12" fill="#183b32"/>
  <text x="78" y="89" fill="#a7f3d0" font-size="11" font-family="Arial, sans-serif">RUNNING · GROQ</text>
  <text x="1020" y="62" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">€0.034 · 7/30 steps</text>

  <rect x="62" y="130" width="500" height="456" rx="16" fill="#111a2a" stroke="#263247"/>
  <text x="88" y="165" fill="#f8fafc" font-size="18" font-family="Arial, sans-serif" font-weight="700">Execution graph</text>
  <line x1="112" y1="205" x2="112" y2="540" stroke="#334155" stroke-width="3"/>

  <g font-family="Arial, sans-serif" font-size="14">
    <circle cx="112" cy="210" r="12" fill="#22c55e"/><path d="M106 210 l4 4 8-9" fill="none" stroke="#062d17" stroke-width="2.5"/><text x="140" y="215" fill="#e2e8f0">Mission received</text>
    <circle cx="112" cy="257" r="12" fill="#22c55e"/><path d="M106 257 l4 4 8-9" fill="none" stroke="#062d17" stroke-width="2.5"/><text x="140" y="262" fill="#e2e8f0">Environment discovery</text>
    <circle cx="112" cy="304" r="12" fill="#22c55e"/><path d="M106 304 l4 4 8-9" fill="none" stroke="#062d17" stroke-width="2.5"/><text x="140" y="309" fill="#e2e8f0">Plan generation</text>
    <circle cx="112" cy="351" r="12" fill="#22c55e"/><path d="M106 351 l4 4 8-9" fill="none" stroke="#062d17" stroke-width="2.5"/><text x="140" y="356" fill="#e2e8f0">Evidence collection</text>
    <circle cx="112" cy="398" r="13" fill="#22d3ee"/><circle cx="112" cy="398" r="5" fill="#083344"/><text x="140" y="403" fill="#67e8f9" font-weight="700">Hypothesis verification</text>
    <circle cx="112" cy="445" r="10" fill="#0a1220" stroke="#475569" stroke-width="2"/><text x="140" y="450" fill="#94a3b8">Solution generation</text>
    <circle cx="112" cy="492" r="10" fill="#0a1220" stroke="#475569" stroke-width="2"/><text x="140" y="497" fill="#94a3b8">Test and review</text>
    <circle cx="112" cy="539" r="10" fill="#0a1220" stroke="#f59e0b" stroke-width="2"/><text x="140" y="544" fill="#fbbf24">Human approval</text>
  </g>

  <rect x="590" y="130" width="546" height="218" rx="16" fill="#111a2a" stroke="#263247"/>
  <text x="616" y="165" fill="#f8fafc" font-size="18" font-family="Arial, sans-serif" font-weight="700">Current activity</text>
  <text x="616" y="205" fill="#67e8f9" font-size="20" font-family="Arial, sans-serif" font-weight="700">Verifying the leading hypothesis</text>
  <text x="616" y="238" fill="#cbd5e1" font-size="14" font-family="Arial, sans-serif">Comparing deployment logs, state transitions and test results.</text>
  <rect x="616" y="268" width="150" height="54" rx="10" fill="#0a1220" stroke="#334155"/>
  <text x="633" y="291" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">MODEL</text>
  <text x="633" y="311" fill="#f8fafc" font-size="13" font-family="Arial, sans-serif">gpt-oss-20b</text>
  <rect x="782" y="268" width="150" height="54" rx="10" fill="#0a1220" stroke="#334155"/>
  <text x="799" y="291" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">COST</text>
  <text x="799" y="311" fill="#f8fafc" font-size="13" font-family="Arial, sans-serif">€0.034 / €2.00</text>
  <rect x="948" y="268" width="160" height="54" rx="10" fill="#0a1220" stroke="#334155"/>
  <text x="965" y="291" fill="#94a3b8" font-size="11" font-family="Arial, sans-serif">BUDGET</text>
  <text x="965" y="311" fill="#f8fafc" font-size="13" font-family="Arial, sans-serif">7 / 30 steps</text>

  <rect x="590" y="370" width="546" height="216" rx="16" fill="#111a2a" stroke="#263247"/>
  <text x="616" y="405" fill="#f8fafc" font-size="18" font-family="Arial, sans-serif" font-weight="700">Evidence collected</text>
  <rect x="616" y="427" width="494" height="50" rx="9" fill="#0a1220"/>
  <circle cx="638" cy="452" r="6" fill="#22c55e"/>
  <text x="655" y="457" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">Health endpoint remained available during the failure</text>
  <rect x="616" y="488" width="494" height="50" rx="9" fill="#0a1220"/>
  <circle cx="638" cy="513" r="6" fill="#22c55e"/>
  <text x="655" y="518" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">Mission step counter was incremented twice per transition</text>
  <text x="616" y="562" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif">Every transition is stored in PostgreSQL for replay and audit.</text>

  <text x="600" y="632" text-anchor="middle" fill="#64748b" font-size="12" font-family="Arial, sans-serif">Illustrated preview based on the current ForgeOps interface</text>
</svg>
